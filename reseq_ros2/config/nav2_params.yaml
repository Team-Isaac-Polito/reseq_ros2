amcl:
  ros__parameters:
    use_sim_time: true
    update_min_d: 0.01
    update_min_a: 0.01
    laser_max_range: 12.0
    laser_min_range: 0.1
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_controller1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: $(find-pkg-share reseq_ros2)/config/navigate_to_pose_no_spin.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share reseq_ros2)/config/navigate_through_poses_no_spin.xml
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.16
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 2.49
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 8.0
      publish_frequency: 4.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.12
      footprint_topic: /robot_footprint_local
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan pointcloud pointcloud_dropoff
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
        pointcloud:
          topic: /camera/depth/color/points
          max_obstacle_height: 2.0
          # 0.05 m floor clearance prevents the ground plane from being
          # marked as an obstacle when the RealSense looks slightly downward.
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
        pointcloud_dropoff:
          topic: /camera/depth/color/points
          # Detect drop-offs: only mark points that are well below floor level
          # (e.g., ramp edges, platform ledges on the KRails arena).
          min_obstacle_height: -0.5
          max_obstacle_height: -0.03
          clearing: false
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 2.0
          obstacle_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 3.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.12
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan pointcloud pointcloud_dropoff
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
        pointcloud:
          topic: /camera/depth/color/points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
        pointcloud_dropoff:
          topic: /camera/depth/color/points
          min_obstacle_height: -0.5
          max_obstacle_height: -0.03
          clearing: false
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 2.0
          obstacle_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 2.49  # Match pivot angular vel from scaler_consts
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.16, 0.0, 2.49]  # Match robot hardware limits: linear=0.16 m/s, angular=2.49 rad/s (pivot mode)
    min_velocity: [-0.05, 0.0, -2.49]
    max_accel: [0.5, 0.0, 3.0]
    max_decel: [-0.5, 0.0, -3.0]
    odom_topic: /diff_controller1/odom
    odom_duration: 0.1
    velocity_timeout: 1.0
    smoothed_vel_topic: cmd_vel_smoothed

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan", "pointcloud", "pointcloud_dropoff"]
    scan:
      type: scan
      topic: /scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
    pointcloud:
      type: pointcloud
      topic: /camera/depth/color/points
      min_height: 0.05
      max_height: 2.0
      enabled: true
    pointcloud_dropoff:
      type: pointcloud
      topic: /camera/depth/color/points
      min_height: -0.5
      max_height: -0.03
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor