slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: laser_frame    # Exact lidar link
    scan_topic: /scan
    mode: mapping  # mapping or localization

    # Process params
    debug_logging: false
    throttle_scans: 1 
    transform_publish_period: 0.02
    map_update_interval: 0.2
    resolution: 0.05
    max_laser_range: 12.0  # RPLIDAR A2M8 max range
    minimum_laser_range: 0.2  # RPLIDAR A2M8 minimum range
    minimum_time_interval: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0 

    # General params
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 50
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.05  # Lower threshold for snake robot with moving scanner
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation params
    correlation_search_space_dimension: 1.5  # Larger search space for snake robot with wheel slip
    correlation_search_space_resolution: 0.015
    correlation_search_space_smear_deviation: 0.1

    # Loop closure params
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher params
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.3
    fine_search_angle_offset: 0.0349  # 2° — wider fine search for snake robot
    coarse_search_angle_offset: 0.785
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # State
    stack_size_to_use: 40000000
