# Metric course for simple_course.world, spawned at the origin facing +x.
# Legs run in order and each starts where the previous one ended. The robot spawns
# facing the east wall with about 0.85 m clear, so the course turns left into the
# open side of the room.
# Goals are in the SLAM map frame, which starts at the spawn pose.
tolerance: 0.25
legs:
  - name: forward
    x: 0.35
    y: 0.0
  - name: gentle_left
    x: 0.6
    y: 0.35
    yaw: 0.6
