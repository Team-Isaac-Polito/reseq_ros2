# Applied on top of reseq_ros2/config/nav2_params.yaml by gazebo.launch.py.
# Only the keys that differ are listed; the shared file stays unchanged.

# The rear modules follow the head's past path (FTL), so the body answers a steering
# change only after it has driven about one module length. Steer gently and never
# reverse: driving backwards makes the tail the head and resets that path history.
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: true

# Read the thinned depth cloud from cloud_decimator instead of the 7 MB original.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        pointcloud:
          topic: /traction/depth/points
        pointcloud_dropoff:
          topic: /traction/depth/points

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        pointcloud:
          topic: /traction/depth/points
        pointcloud_dropoff:
          topic: /traction/depth/points

collision_monitor:
  ros__parameters:
    pointcloud:
      topic: /traction/depth/points
    pointcloud_dropoff:
      topic: /traction/depth/points
