---
include:
  xacro: digital_twin_params.yaml
  scaler_consts: scaler_consts.yaml
  agevar_consts: agevar_consts.yaml
scaler_consts:
  arm_axis_z: "-left.z"
  arm_z_isolation_ratio: 0.45
  arm_debug_log: true
version: "mk2"
canbus:
  channel: "can0"
num_modules: 3
modules:
  - address: 0x21
    hasJoint: true
    hasEndEffector: false
  - address: 0x22
    hasJoint: true
    hasEndEffector: false
  - address: 0x23
    hasJoint: true
    hasEndEffector: false
realsense_config: "realsense_rgb_motion.yaml"
usb_camera_config: "usb_camera.yaml"
tof_config: "tof_params.yaml"
sensors:
  - realsense: true
  - lidar: true
  - usb_cameras: 2
  - thermal: true
  - tof: true
