# Arm J6 beak setpoint — int32: 0=close (grip), 1=open. The firmware restarts its grip state
# machine on every frame, so it is sent on change only. Command via beak_controller:
# mod1__beak/position, rounded and clamped to {0, 1}.
- {
  msg_id: 0x5B,
  modules: "only_first",
  length: 4,
  is_command: true,
  send_mode: "on_change",
  fields: [
    { name: "beak", type: "command", mode: "position", data_type: "int32", min: 0, max: 1 },
  ]
}

# ── Inter-module joint — MK2 MOD2/MOD3 (0x6X) ──────────────────────────────

- {
  msg_id: 0x61, # Joint differential pitch/yaw setpoint — Float×2, rad
  modules: "skip_first",
  length: 8,
  is_command: true,
  fields: [
    { name: "yaw_joint",   type: "command", mode: "position" },
    { name: "pitch_joint", type: "command", mode: "position", offset: 4 },
  ]
}
