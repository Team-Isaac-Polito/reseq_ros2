# ── Status / diagnostics (0x7X) ─────────────────────────────────────────────

# - {
#   msg_id: 0x72, # Motor traction error status — uint8[2]: right, left (read-only)
#   modules: "all",
#   length: 2,
#   fields: []
# }
# - {
#   msg_id: 0x73, # Motor arm error status — uint8[7]: J1a…J6 (read-only)
#   modules: "only_first",
#   length: 7,
#   fields: []
# }
# Torque enable/disable — uint16 bitfield, 1=enable / 0=disable per motor (STM32LowLevel main.cpp):
#   bit 0 right traction, bit 1 left traction                      — all modules
#   bits 2-8 arm J1a, J1b, J2, J3, J4, J5, J6 (beak)                — MOD1 (MODC_ARM)
#   bits 2-4 joint J1-left, J1-right (differential pitch/yaw), J2 roll — MOD2/MOD3 (MODC_JOINT)
# The frame always carries every bit, so each motor group is a separate gpio command and the
# remote only owns the group it controls (mod<N>__torque/joint). Traction and roll start from the
# URDF initial_value (traction enabled, roll disabled as at firmware boot); the frame is not sent
# until mod<N>__torque/joint receives its first command.
- {
  msg_id: 0x74,
  modules: "skip_first",
  length: 2,
  is_command: true,
  send_mode: "on_change",
  fields: [
    { name: "torque", type: "gpio_command", mode: "traction", data_type: "uint16", bitmask: 0x0003 },
    { name: "torque", type: "gpio_command", mode: "joint",    data_type: "uint16", bitmask: 0x000C },
    { name: "torque", type: "gpio_command", mode: "roll",     data_type: "uint16", bitmask: 0x0010 },
  ]
}
# MOD1 (arm) torque is not exposed yet. If needed, add a "only_first" mapping with
# { mode: "traction", bitmask: 0x0003 } and { mode: "arm", bitmask: 0x01FC } and the matching gpio.

# LED HP board brightness — uint8, 0=off … 255=max. Handled by MOD1 firmware built with MODC_ARM.
- {
  msg_id: 0x75,
  modules: "only_first",
  length: 1,
  is_command: true,
  send_mode: "on_change",
  fields: [
    { name: "led", type: "gpio_command", mode: "brightness", data_type: "uint8", min: 0, max: 255 },
  ]
}

