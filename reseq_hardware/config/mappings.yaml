# CAN message mappings
#
# modules: "all"       → every module (1..num_modules)
# modules: "skip_first" → modules 2..num_modules (skips module 1)
# modules: "only_first" → module 1 only
# modules: "only_third" → module 3 only
#
# Message keys:
#   is_command: true       → written by ReseqHardware::write()
#   send_mode:  "cyclic"    → (default) sent every command cycle — setpoint streams
#               "on_change" → sent only when the encoded payload changes — one-shot actions
#                             (torque, LED, beak). Held back while any field has no command
#                             yet (NaN); retried on the next cycle if the CAN send fails.
#
# Field keys:
#   type:      "state" | "command" (joint interface) | "gpio_command" (ros2_control <gpio>)
#              The name gets the "mod<N>__" prefix, e.g. "led" → "mod1__led".
#   mode:      joint interface (position/velocity/effort) or gpio command interface name
#   data_type: float32 | int8 | uint8 | int16 | uint16 | int32 | uint32  (little-endian)
#   scale/bias: ros_value = raw * scale + bias
#   min/max:   clamp on the raw value before encoding (integers are also rounded and saturated)
#   bitmask:   flag field — a non-zero command sets these bits of the word, zero clears them.
#              Several flag fields may share the same word.

# ── Traction (0x2X) ──────────────────────────────────────────────────────────

- {
  msg_id: 0x21, # Motor setpoint — 2×Float, RPM
  modules: "all",
  length: 8,
  is_command: true,
  fields: [  # scale = 2π/60 = 0.104719 rad/s per RPM
    { name: "left_back_wheel",  type: "command", mode: "velocity", data_type: "float32", offset: 0, scale: 0.104719, bias: 0.0 },
    { name: "right_back_wheel", type: "command", mode: "velocity", offset: 4, scale: 0.104719 }
  ]
}
- {
  msg_id: 0x22, # Motor feedback — 2×Float, RPM
  length: 8,
  fields: [
    { name: "left_front_wheel",  mode: "velocity", type: "state", scale: 0.104719 },
    { name: "right_front_wheel", mode: "velocity", offset: 4, scale: 0.104719 },
    { name: "left_back_wheel",   mode: "velocity", scale: 0.104719 },
    { name: "right_back_wheel",  mode: "velocity", offset: 4, scale: 0.104719 },
  ]
}
# ── Inter-module sensors (0x3X) ──────────────────────────────────────────────

- {
  msg_id: 0x32, # Joint yaw feedback (IMU derived) — Float, degrees (AS5048B)
  modules: "skip_first",
  length: 4,
  fields: [
    { name: "yaw_joint", scale: -0.017453 }, # degrees → radians
  ]
}
- {
  msg_id: 0x34, # Joint pitch feedback (IMU derived) — Float, radians
  modules: "skip_first",
  length: 4,
  fields: [
    { name: "pitch_joint", type: "state", mode: "position", scale: -1.0 },
  ]
}
- {
  msg_id: 0x36, # Joint roll feedback (IMU derived) — Float, radians
  modules: "skip_first",
  length: 4,
  fields: [
    { name: "roll_joint", type: "state", mode: "position", scale: -1.0 },
  ]
}

